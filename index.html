<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vetmo@portfolio:~</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,700;1,400&display=swap');

  :root {
    --bg: #0a0e14;
    --bg-panel: #0d131c;
    --text: #c5d1e5;
    --text-dim: #5b6b85;
    --accent: #7aa2f7;      /* холодный синий */
    --accent2: #e0af68;     /* тёплое золото — предупреждения */
    --claude: #d97757;      /* терракота Claude */
    --err: #f7768e;
    --ok: #9ece6a;
    --border: #1c2533;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace;
    font-size: 15px;
    min-height: 100%;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 60px;
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(217,119,87,0.05), transparent),
      repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.12) 2px, rgba(0,0,0,0.12) 4px);
    position: relative;
    overflow-x: hidden;
  }

  /* ===== Интерактивный фон ===== */
  #bg-canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
    display: block;
  }

  .terminal, .footer { position: relative; z-index: 1; }

  /* ===== Окно терминала ===== */
  .terminal {
    width: 100%;
    max-width: 760px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(122,162,247,0.05);
    overflow: hidden;
  }

  .titlebar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: #0b0f17;
    border-bottom: 1px solid var(--border);
    user-select: none;
  }

  .titlebar .dot { width: 11px; height: 11px; border-radius: 50%; }
  .dot.r { background: #f7768e; }
  .dot.y { background: #e0af68; }
  .dot.g { background: #9ece6a; }

  .titlebar .title {
    flex: 1;
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
    letter-spacing: 0.5px;
  }

  .screen {
    padding: 18px 18px 8px;
    min-height: 420px;
    line-height: 1.65;
    overflow-y: auto;
    max-height: 75vh;
  }

  .screen::-webkit-scrollbar { width: 8px; }
  .screen::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* ===== Типографика вывода ===== */
  .prompt-line { white-space: pre-wrap; word-break: break-word; }
  .prompt { color: var(--ok); }
  .prompt .path { color: var(--accent); }
  .cursor {
    display: inline-block;
    width: 8px;
    height: 16px;
    background: var(--accent);
    vertical-align: text-bottom;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .out { white-space: pre-wrap; word-break: break-word; margin: 2px 0 6px; }
  .dim { color: var(--text-dim); }
  .blue { color: var(--accent); }
  .gold { color: var(--accent2); }
  .ok { color: var(--ok); }
  .err { color: var(--err); }
  .hr { color: var(--border); }

  a { color: var(--accent); text-decoration: none; border-bottom: 1px dotted var(--accent); }
  a:hover { color: #b4c9ff; border-bottom-style: solid; }

  .cmd-table td { padding: 2px 14px 2px 0; vertical-align: top; }
  .cmd-table .cmd { color: var(--ok); white-space: nowrap; }

  /* ===== Строка ввода ===== */
  .input-line { display: flex; align-items: center; padding: 4px 0 8px; }
  .input-line .prompt { margin-right: 8px; white-space: nowrap; }
  #cmd-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font: inherit;
    caret-color: transparent;
  }

  /* ===== Подвал ===== */
  .footer {
    max-width: 760px;
    width: 100%;
    margin-top: 14px;
    text-align: center;
    color: var(--text-dim);
    font-size: 12px;
  }
  .footer .keys b { color: var(--text); font-weight: 400; }

  @media (max-width: 560px) {
    body { font-size: 13.5px; padding: 12px 8px 40px; }
    .screen { padding: 12px 12px 4px; }
  }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="terminal">
  <div class="titlebar">
    <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
    <span class="title">vetmo@portfolio: ~ — bash</span>
    <span style="width:41px"></span>
  </div>
  <div class="screen" id="screen">
    <div class="out" id="boot"></div>
    <div id="output"></div>
    <div class="input-line" id="input-line" style="display:none">
      <span class="prompt">vetmo@<span class="path">~</span>$</span>
      <input id="cmd-input" autocomplete="off" spellcheck="false" autofocus>
    </div>
  </div>
</div>

<div class="footer">
  <span class="keys">команды: <b>help</b> · <b>about</b> · <b>projects</b> · <b>contact</b> · <b>clear</b> — вводите снизу или <b>Tab</b> для подсказки</span>
</div>

<script>
(function () {
  var screen = document.getElementById('screen');
  var output = document.getElementById('output');
  var input = document.getElementById('cmd-input');
  var inputLine = document.getElementById('input-line');
  var boot = document.getElementById('boot');

  var history = [];
  var histIdx = -1;

  function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function print(html, cls) {
    var d = document.createElement('div');
    d.className = 'out' + (cls ? ' ' + cls : '');
    d.innerHTML = html;
    output.appendChild(d);
    screen.scrollTop = screen.scrollHeight;
    return d;
  }

  function printPrompt(cmd) {
    print('<span class="prompt">vetmo@<span class="path">~</span>$</span> ' + esc(cmd));
  }

  // ===== Данные =====

  var SECTIONS = {};

  SECTIONS.help = function () {
    var rows = [
      ['help',     'этот список'],
      ['about',    'кто я'],
      ['projects', 'избранные работы'],
      ['contact',  'связаться'],
      ['clear',    'очистить экран']
    ];
    var t = '<table class="cmd-table">';
    for (var i = 0; i < rows.length; i++) {
      t += '<tr><td class="cmd">' + rows[i][0] + '</td><td class="dim">' + rows[i][1] + '</td></tr>';
    }
    print(t + '</table>');
  };

  SECTIONS.about = function () {
    print([
      '<span class="dim">## identity</span>',
      '',
      '  имя        <span class="dim">:</span> <span class="gold">vetmo</span>',
      '  стек       <span class="dim">:</span> Python · Java · C# · Rust',
      '  сфера      <span class="dim">:</span> десктоп-утилиты, чекеры, моды для игр, скрипты инфраструктуры',
      '',
      '<span class="dim">## принципы</span>',
      '',
      '  1. утилита должна решать одну задачу и делать это хорошо',
      '  2. код читают чаще, чем пишут',
      '  3. All is dust. <span class="dim">(иногда — к лучшему: рефакторинг обязателен)</span>',
      ''
    ].join('\n'));
  };

  SECTIONS.projects = function () {
    print('<span class="dim">## зарегистрированные записи: 2</span>\n');
    print([
      '<span class="blue">01  ChaosMarineMod</span> <span class="dim">· c# · harmony · .net 4.8</span>',
      '    мод для Warhammer 40k: Rogue Trader: путь Аримана, десант Хаоса,',
      '    тактический ИИ. Harmony-патчи + нативная система модов Owlcat.',
      '',
      '<span class="blue">02  ZomboidSaveGuard</span> <span class="dim">· powershell · windows</span>',
      '    автоматические бэкапы и восстановление сохранений Project Zomboid',
      '    в один клик на Windows. ',
      '    <span class="dim">репозиторий — </span><a href="https://github.com/aitools1/zomboid-save-guard" target="_blank" rel="noopener">aitools1/zomboid-save-guard</a>',
      ''
    ].join('\n'));
  };

  SECTIONS.contact = function () {
    print([
      '<span class="dim">## каналы связи</span>',
      '',
      '  github    <span class="dim">:</span> <a href="https://github.com/aitools1" target="_blank" rel="noopener">github.com/aitools1</a>',
      '  mail      <span class="dim">:</span> <a href="mailto:devprotonme1@proton.me">devprotonme1@proton.me</a>',
      '',
      '<span class="dim">// отвечаю без ритуалов и призывов демонов. обычно.</span>',
      ''
    ].join('\n'));
  };

  SECTIONS['sudo'] = function () {
    print('<span class="err">vetmo is not in the sudoers file. This incident will be reported.</span>');
  };

  SECTIONS['whoami'] = function () {
    print('<span class="gold">vetmo</span> <span class="dim">из секты «Работает — не трогай»</span>');
  };

  SECTIONS['ls'] = function () {
    print('<span class="blue">about/  projects/  contact/  .secrets/  imperial_truth.pdf</span>');
  };

  // ===== Обработка команд =====

  var COMMANDS = {};
  var names = Object.keys(SECTIONS);
  COMMANDS['clear'] = function () { output.innerHTML = ''; };
  COMMANDS['exit'] = function () {
    print('<span class="dim">дверь отсека закрыта с той стороны. выхода нет — только проекты.</span>');
  };

  function run(raw) {
    var cmd = raw.trim().toLowerCase();
    printPrompt(raw);
    if (!cmd) return;
    history.push(raw);
    histIdx = history.length;

    if (SECTIONS[cmd]) { SECTIONS[cmd](); return; }
    if (COMMANDS[cmd]) { COMMANDS[cmd](); return; }

    print('<span class="err">bash: ' + esc(cmd) + ': команда не найдена</span> <span class="dim">— введите</span> <span class="ok">help</span>');
  }

  // Tab-автодополнение
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      run(input.value);
      input.value = '';
    } else if (e.key === 'ArrowUp') {
      if (histIdx > 0) { histIdx--; input.value = history[histIdx] || ''; }
      e.preventDefault();
    } else if (e.key === 'ArrowDown') {
      if (histIdx < history.length) { histIdx++; input.value = history[histIdx] || ''; }
      e.preventDefault();
    } else if (e.key === 'Tab') {
      var v = input.value.trim().toLowerCase();
      if (v) {
        var match = names.concat(Object.keys(COMMANDS)).filter(function (n) { return n.indexOf(v) === 0; });
        if (match.length === 1) { input.value = match[0]; }
        else if (match.length > 1) { print('<span class="dim">' + match.join('  ') + '</span>'); }
      }
      e.preventDefault();
    }
  });

  // Клик по экрану — фокус в ввод
  document.querySelector('.terminal').addEventListener('click', function (e) {
    if (window.getSelection().toString()) return;
    input.focus({ preventScroll: true });
  });

  // ===== Boot-последовательность =====

  var bootLines = [
    ['dim',  '[    0.000000] ядро portfolio-v0.1 инициализировано'],
    ['dim',  '[    0.142033] загрузка модулей: about.projects.contact .... ok'],
    ['dim',  '[    0.318402] профиль подключён .... ok'],
    ['gold', '[    0.441028] WARNING: veil is thin. соблюдайте осторожность.'],
    ['',     ''],
    ['blue', '  ██╗   ██╗███████╗██████╗ ███████╗███████╗'],
    ['blue', '  ██║   ██║██╔════╝██╔══██╗██╔════╝██╔════╝'],
    ['blue', '  ██║   ██║█████╗  ██████╔╝█████╗  █████╗  '],
    ['blue', '  ╚██║ ██╔╝██╔══╝  ██╔══██╗██╔══╝  ██╔══╝  '],
    ['blue', '   ╚████╔╝ ███████╗██║  ██║███████╗███████╗'],
    ['blue', '    ╚═══╝  ╚══════╝╚═╝  ╚═╝╚══════╝╚══════╝'],
    ['',     ''],
    ['dim',  'введите ']
  ];

  var li = 0;
  var typing = true;

  function typeBoot() {
    if (li < bootLines.length) {
      var item = bootLines[li];
      var d = document.createElement('div');
      d.className = 'out ' + item[0];
      d.innerHTML = item[1];
      boot.appendChild(d);
      li++;
      screen.scrollTop = screen.scrollHeight;
      setTimeout(typeBoot, 90);
    } else {
      var last = boot.lastChild;
      last.innerHTML = 'введите <span class="ok">help</span>, чтобы посмотреть доступные команды';
      typing = false;
      inputLine.style.display = 'flex';
      input.focus();
      run('about');
    }
  }

  typeBoot();
})();

/* ===== Интерактивный фон: дрейфующие глифы кода ===== */
(function () {
  var canvas = document.getElementById('bg-canvas');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  if (!ctx) return;

  var W = 0, H = 0, DPR = 1;
  var glyphs = [];
  var mouse = { x: -9999, y: -9999, inside: false };
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Символы в духе Claude Code: ASCII-границы, стрелки, операторы
  var CHARS = '╭╰─│>#$%&*+=<>(){}[]/\\;:.!?~^|01'.split('');
  var COLORS = [
    '122,162,247',  /* синий  */
    '217,119,87',   /* терракота Claude */
    '224,175,104',  /* золото */
    '158,206,106'   /* зелёный */
  ];

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    spawn();
  }

  function spawn() {
    glyphs = [];
    // плотность зависит от площади экрана
    var count = Math.max(24, Math.min(110, Math.round((W * H) / 16000)));
    for (var i = 0; i < count; i++) {
      glyphs.push({
        x: Math.random() * W,
        y: Math.random() * H,
        ch: CHARS[(Math.random() * CHARS.length) | 0],
        size: 10 + Math.random() * 10,
        speed: 0.15 + Math.random() * 0.35,   // px/кадр вверх
        drift: (Math.random() - 0.5) * 0.2,   // лёгкий горизонтальный дрейф
        alpha: 0.08 + Math.random() * 0.22,
        color: COLORS[(Math.random() * COLORS.length) | 0],
        phase: Math.random() * Math.PI * 2,    // фаза мерцания
        phaseSpeed: 0.5 + Math.random() * 1.5,
        vx: 0, vy: 0                            // отклик на мышь
      });
    }
  }

  window.addEventListener('resize', function () {
    clearTimeout(window.__rz);
    window.__rz = setTimeout(resize, 150);
  });

  window.addEventListener('pointermove', function (e) {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.inside = true;
  });
  window.addEventListener('pointerleave', function () { mouse.inside = false; });

  var last = 0;

  function frame(t) {
    var dt = Math.min((t - last) / 16.6, 3) || 1;
    last = t;
    ctx.clearRect(0, 0, W, H);

    // Мягкое свечение за курсором (как подсветка карточки на референсе)
    if (mouse.inside) {
      var glow = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 260);
      glow.addColorStop(0, 'rgba(217,119,87,0.055)');
      glow.addColorStop(0.5, 'rgba(122,162,247,0.028)');
      glow.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, W, H);
    }

    for (var i = 0; i < glyphs.length; i++) {
      var g = glyphs[i];

      // Реакция на курсор: глифы рядом загораются и мягко расступаются
      var dx = g.x - mouse.x;
      var dy = g.y - mouse.y;
      var dist = Math.sqrt(dx * dx + dy * dy);
      var near = 0;
      if (mouse.inside && dist < 130) {
        near = 1 - dist / 130;
        var f = near * 0.9 * dt;
        g.vx += (dx / (dist + 0.001)) * f;
        g.vy += (dy / (dist + 0.001)) * f;
      }

      // затухание инерции
      g.vx *= 0.92;
      g.vy *= 0.92;

      g.x += (g.drift + g.vx) * dt;
      g.y += (-g.speed + g.vy) * dt;

      // мерцание
      var tw = 0.75 + 0.25 * Math.sin(t / 1000 * g.phaseSpeed + g.phase);
      var a = (g.alpha + near * 0.6) * tw;

      // wrap по краям
      if (g.y < -20) { g.y = H + 20; g.x = Math.random() * W; }
      if (g.y > H + 20) { g.y = -20; }
      if (g.x < -20) { g.x = W + 20; }
      if (g.x > W + 20) { g.x = -20; }

      ctx.font = g.size + 'px "JetBrains Mono", Consolas, monospace';
      ctx.fillStyle = 'rgba(' + g.color + ',' + a.toFixed(3) + ')';
      ctx.fillText(g.ch, g.x, g.y);
    }

    requestAnimationFrame(frame);
  }

  resize();
  if (reduced) {
    // статичная отрисовка одного кадра для тех, кто просил меньше движения
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < glyphs.length; i++) {
      var g = glyphs[i];
      ctx.font = g.size + 'px "JetBrains Mono", Consolas, monospace';
      ctx.fillStyle = 'rgba(' + g.color + ',' + g.alpha + ')';
      ctx.fillText(g.ch, g.x, g.y);
    }
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
