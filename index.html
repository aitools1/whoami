<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vetmo@portfolio:~</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,700;1,400&display=swap');

  :root {
    --bg: #0a0e14;
    --bg-panel: #0d131c;
    --text: #c5d1e5;
    --text-dim: #5b6b85;
    --accent: #7aa2f7;      /* холодный синий */
    --accent2: #e0af68;     /* тёплое золото — предупреждения */
    --claude: #d97757;      /* терракота Claude */
    --err: #f7768e;
    --ok: #9ece6a;
    --border: #1c2533;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace;
    font-size: 15px;
    min-height: 100%;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 60px;
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(217,119,87,0.05), transparent),
      repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.12) 2px, rgba(0,0,0,0.12) 4px);
    position: relative;
    overflow-x: hidden;
  }

  /* ===== Интерактивный фон ===== */
  #bg-canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
    display: block;
  }

  /* ===== Подсветка за терминалом (как на референсе) ===== */
  .ambient {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse 420px 320px at 18% 12%, rgba(217,119,87,0.13), transparent 65%),
      radial-gradient(ellipse 460px 340px at 82% 20%, rgba(122,162,247,0.11), transparent 65%),
      radial-gradient(ellipse 500px 380px at 50% 95%, rgba(224,175,104,0.07), transparent 70%);
    animation: ambient-shift 14s ease-in-out infinite alternate;
  }
  @keyframes ambient-shift {
    0%   { filter: hue-rotate(0deg) brightness(1); }
    50%  { filter: hue-rotate(-8deg) brightness(1.15); }
    100% { filter: hue-rotate(6deg) brightness(0.95); }
  }

  .terminal, .footer { position: relative; z-index: 1; }

  /* ===== Окно терминала ===== */
  .terminal {
    width: 100%;
    max-width: 760px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(122,162,247,0.05);
    overflow: hidden;
  }

  .titlebar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: #0b0f17;
    border-bottom: 1px solid var(--border);
    user-select: none;
  }

  .titlebar .dot { width: 11px; height: 11px; border-radius: 50%; }
  .dot.r { background: #f7768e; }
  .dot.y { background: #e0af68; }
  .dot.g { background: #9ece6a; }

  .titlebar .title {
    flex: 1;
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
    letter-spacing: 0.5px;
  }

  .screen {
    padding: 18px 18px 8px;
    min-height: 420px;
    line-height: 1.65;
    overflow-y: auto;
    max-height: 75vh;
  }

  .screen::-webkit-scrollbar { width: 8px; }
  .screen::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* ===== Типографика вывода ===== */
  .prompt-line { white-space: pre-wrap; word-break: break-word; }
  .prompt { color: var(--ok); }
  .prompt .path { color: var(--accent); }
  .cursor {
    display: inline-block;
    width: 8px;
    height: 16px;
    background: var(--accent);
    vertical-align: text-bottom;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .out { white-space: pre-wrap; word-break: break-word; margin: 2px 0 6px; }
  .dim { color: var(--text-dim); }
  .blue { color: var(--accent); }
  .gold { color: var(--accent2); }
  .ok { color: var(--ok); }
  .err { color: var(--err); }
  .hr { color: var(--border); }

  a { color: var(--accent); text-decoration: none; border-bottom: 1px dotted var(--accent); }
  a:hover { color: #b4c9ff; border-bottom-style: solid; }

  .cmd-table td { padding: 2px 14px 2px 0; vertical-align: top; }
  .cmd-table .cmd { color: var(--ok); white-space: nowrap; }

  /* ===== Строка ввода ===== */
  .input-line { display: flex; align-items: center; padding: 4px 0 4px; }
  .input-line .prompt { margin-right: 8px; white-space: nowrap; }
  #cmd-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font: inherit;
    caret-color: transparent;
  }

  /* ===== Кликабельные чипы-команды ===== */
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 8px 0 14px;
    border-top: 1px dashed var(--border);
    margin-top: 8px;
  }
  .chip {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text-dim);
    font: inherit;
    font-size: 13px;
    padding: 5px 14px;
    cursor: pointer;
    transition: border-color .15s, color .15s, background .15s, box-shadow .15s;
    user-select: none;
  }
  .chip:hover {
    color: var(--text);
    border-color: var(--accent);
    background: rgba(122,162,247,0.08);
    box-shadow: 0 0 12px rgba(122,162,247,0.15);
  }
  .chip:active { transform: translateY(1px); }
  .chip.gold:hover {
    border-color: var(--accent2);
    background: rgba(224,175,104,0.08);
    box-shadow: 0 0 12px rgba(224,175,104,0.15);
  }

  /* ===== Карточка-хедер профиля ===== */
  .profile {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px;
    margin-bottom: 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: linear-gradient(135deg, rgba(122,162,247,0.05), rgba(217,119,87,0.04));
  }
  .avatar {
    width: 72px;
    height: 72px;
    flex: 0 0 72px;
    border: 1px solid var(--accent);
    border-radius: 10px;
    background: #0b0f17;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 18px rgba(122,162,247,0.2), inset 0 0 12px rgba(122,162,247,0.08);
    cursor: default;
    position: relative;
    overflow: hidden;
  }
  .avatar .sym {
    font-size: 24px;
    color: var(--accent);
    line-height: 1;
  }
  .avatar .sym2 {
    font-size: 13px;
    color: var(--accent2);
    line-height: 1;
    margin-top: 3px;
  }
  .avatar::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, transparent 30%, rgba(122,162,247,0.15) 50%, transparent 70%);
    transform: translateX(-100%);
    animation: avatar-scan 4.5s ease-in-out infinite;
  }
  @keyframes avatar-scan {
    0%   { transform: translateX(-100%); }
    60%  { transform: translateX(100%); }
    100% { transform: translateX(100%); }
  }
  .profile .info { flex: 1; min-width: 0; }
  .profile .name {
    font-size: 19px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.5px;
  }
  .profile .name .cursor-sm {
    display: inline-block;
    width: 9px; height: 17px;
    background: var(--accent);
    vertical-align: -3px;
    margin-left: 6px;
    animation: blink 1s step-end infinite;
  }
  .profile .tagline {
    color: var(--text-dim);
    font-size: 13px;
    margin-top: 4px;
    white-space: pre-wrap;
  }
  .profile .cta {
    border: 1px solid var(--accent);
    border-radius: 6px;
    background: rgba(122,162,247,0.1);
    color: var(--text);
    font: inherit;
    font-size: 13.5px;
    padding: 10px 16px;
    cursor: pointer;
    white-space: nowrap;
    transition: background .15s, box-shadow .15s, transform .15s;
  }
  .profile .cta:hover {
    background: rgba(122,162,247,0.2);
    box-shadow: 0 0 14px rgba(122,162,247,0.25);
    transform: translateY(-1px);
  }
  .profile .cta:active { transform: translateY(1px); }
  @media (max-width: 560px) {
    .profile { flex-wrap: wrap; gap: 12px; }
    .profile .cta { width: 100%; }
  }
  .social-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin: 10px 0 6px;
    max-width: 480px;
  }
  .social-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: rgba(13,19,28,0.6);
    color: var(--text);
    text-decoration: none;
    font: inherit;
    font-size: 14px;
    transition: border-color .15s, transform .15s, box-shadow .15s, background .15s;
  }
  .social-btn .sym { color: var(--accent); }
  .social-btn:hover {
    border-color: var(--accent);
    background: rgba(122,162,247,0.09);
    box-shadow: 0 0 16px rgba(122,162,247,0.18);
    transform: translateY(-2px);
  }
  .social-btn.gold .sym { color: var(--accent2); }
  .social-btn.gold:hover {
    border-color: var(--accent2);
    background: rgba(224,175,104,0.09);
    box-shadow: 0 0 16px rgba(224,175,104,0.18);
  }
  @media (max-width: 560px) {
    .social-grid { grid-template-columns: repeat(2, 1fr); }
  }

  /* ===== Подвал ===== */
  .footer {
    max-width: 760px;
    width: 100%;
    margin-top: 14px;
    text-align: center;
    color: var(--text-dim);
    font-size: 12px;
  }
  .footer .keys b { color: var(--text); font-weight: 400; }

  @media (max-width: 560px) {
    body { font-size: 13.5px; padding: 12px 8px 40px; }
    .screen { padding: 12px 12px 4px; }
  }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div class="ambient"></div>

<div class="terminal">
  <div class="titlebar">
    <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
    <span class="title">vetmo@portfolio: ~ — bash</span>
    <span style="width:41px"></span>
  </div>
  <div class="screen" id="screen">
    <div class="profile">
      <div class="avatar"><span class="sym">λ</span><span class="sym2">v·</span></div>
      <div class="info">
        <div class="name">я vetmo<span class="cursor-sm"></span></div>
        <div class="tagline">python · java · c# · rust
десктоп-утилиты, чекеры, моды для игр, скрипты инфраструктуры</div>
      </div>
      <button class="cta" id="cta-about">познакомиться со мной →</button>
    </div>
    <div class="out" id="boot"></div>
    <div id="output"></div>
    <div class="input-line" id="input-line" style="display:none">
      <span class="prompt">vetmo@<span class="path">~</span>$</span>
      <input id="cmd-input" autocomplete="off" spellcheck="false" autofocus>
    </div>
    <div class="chips" id="chips" style="display:none">
      <button class="chip" data-cmd="about">обо мне</button>
      <button class="chip" data-cmd="projects">мои проекты</button>
      <button class="chip" data-cmd="contact">контакты</button>
      <button class="chip" data-cmd="help">справка</button>
      <button class="chip" data-cmd="clear">очистить</button>
      <button class="chip gold" data-url="https://github.com/aitools1" data-label="github">github ↗</button>
    </div>
  </div>
</div>

<div class="footer">
  <span class="keys">команды: <b>help</b> · <b>about</b> · <b>projects</b> · <b>contact</b> · <b>clear</b> — вводите снизу или <b>Tab</b> для подсказки</span>
</div>

<script>
(function () {
  var screen = document.getElementById('screen');
  var output = document.getElementById('output');
  var input = document.getElementById('cmd-input');
  var inputLine = document.getElementById('input-line');
  var boot = document.getElementById('boot');

  var history = [];
  var histIdx = -1;
  var typingQueue = null;   // активная печать секции
  var typingToken = 0;      // токен для отмены предыдущей печати

  function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function print(html, cls) {
    var d = document.createElement('div');
    d.className = 'out' + (cls ? ' ' + cls : '');
    d.innerHTML = html;
    output.appendChild(d);
    screen.scrollTop = screen.scrollHeight;
    return d;
  }

  function printNode(node) {
    var d = document.createElement('div');
    d.className = 'out';
    d.appendChild(node);
    output.appendChild(d);
    screen.scrollTop = screen.scrollHeight;
    return d;
  }

  function printPrompt(cmd) {
    print('<span class="prompt">vetmo@<span class="path">~</span>$</span> ' + esc(cmd));
  }

  // ===== Печать секции с эффектом набора текста =====

  function typeSection(lines, done) {
    var token = ++typingToken;
    var li = 0;
    var target = document.createElement('div');
    output.appendChild(target);

    function nextLine() {
      if (token !== typingToken) { return; }   // печать отменена новой командой
      if (li >= lines.length) {
        printAccept(target);
        if (done) done();
        return;
      }
      var item = lines[li];
      var d = document.createElement('div');
      d.className = 'out' + (item.cls ? ' ' + item.cls : '');
      target.appendChild(d);
      screen.scrollTop = screen.scrollHeight;
      if (!item.text) { li++; setTimeout(nextLine, 30); return; }

      // посимвольный набор
      typeText(d, item.text, 0, item.instant ? Infinity : 8, function () {
        li++;
        setTimeout(nextLine, 60);
      });
    }

    function typeText(el, html, pos, speed, cb) {
      // печатаем по HTML-тегам целиком, текст — по символам
      var m = /<[^>]+>/.exec(html.substring(pos));
      if (m && m.index === 0) {
        el.innerHTML += m[0];
        pos += m[0].length;
        typeText(el, html, pos, speed, cb);
        return;
      }
      var rest = html.substring(pos);
      var nextTag = rest.indexOf('<');
      var plain = nextTag === -1 ? rest : rest.substring(0, nextTag);
      if (plain.length === 0) {
        if (nextTag === -1) { cb(); return; }
        typeText(el, html, pos, speed, cb);
        return;
      }
      el.innerHTML += esc(plain.charAt(0));
      setTimeout(function () {
        if (token !== typingToken) { return; }
        typeText(el, html, pos + 1, speed, cb);
      }, speed);
    }

    nextLine();
  }

  function printAccept(target) {
    var d = document.createElement('div');
    d.className = 'out accept';
    d.innerHTML = '<span class="ok">ACCEPT</span> <span class="dim">' + new Date().toLocaleTimeString('ru-RU') + '</span>';
    if (target && target.parentNode) { target.parentNode.insertBefore(d, target.nextSibling); }
    else { output.appendChild(d); }
    screen.scrollTop = screen.scrollHeight;
  }

  // ===== Данные =====

  var SECTIONS = {};

  SECTIONS.help = function () {
    return [
      { text: '<span class="dim">## доступные команды</span>' },
      { text: '' },
      { text: '<span class="ok">help</span>      <span class="dim">этот список</span>' },
      { text: '<span class="ok">about</span>     <span class="dim">кто я</span>' },
      { text: '<span class="ok">projects</span>  <span class="dim">избранные работы</span>' },
      { text: '<span class="ok">contact</span>   <span class="dim">связаться</span>' },
      { text: '<span class="ok">clear</span>     <span class="dim">очистить экран</span>' }
    ];
  };

  SECTIONS.about = function () {
    return [
      { text: '<span class="gold">Превращаю смелые идеи в работающий софт. Быстро, гибко и с помощью AI.</span>' },
      { text: '' },
      { text: 'Я практик: использую нейросети как ускоритель разработки,' },
      { text: 'чтобы проверять гипотезы за часы, а не месяцы.' },
      { text: '' },
      { text: '  <span class="ok">[+]</span> <b>Геймдев &amp; Моды:</b>' },
      { text: '      Создаю модификации, которые дают любимым играм второе дыхание.' },
      { text: '' },
      { text: '  <span class="ok">[+]</span> <b>Десктопный инструментарий:</b>' },
      { text: '      Разрабатываю утилиты под Windows для оптимизации процессов,' },
      { text: '      автоматизации рутины и комфортной работы с системой.' },
      { text: '' },
      { text: '  <span class="ok">[+]</span> <b>Стек &amp; Инструменты:</b>' },
      { text: '      <span class="blue">•</span> AI-Assisted Dev <span class="dim">(LLM, Prompt Engineering)</span>' },
      { text: '      <span class="blue">•</span> Python / C# / Lua' },
      { text: '      <span class="blue">•</span> Windows API / Скриптинг автоматизации' },
      { text: '' },
      { text: 'Открыт к интересным проектам и экспериментам.' },
      { text: '<span class="hr">────────────────────────────────────────────────────────</span>' },
      { text: '&gt; Введите <span class="ok">\'projects\'</span>, чтобы увидеть работы в действии.' }
    ];
  };

  SECTIONS.projects = function () {
    var lines = [
      { text: '<span class="dim">## зарегистрированные записи: 2</span>' },
      { text: '' },
      { text: '<span class="blue">01  ChaosMarineMod</span> <span class="dim">· c# · harmony · .net 4.8</span>' },
      { text: '    мод для Warhammer 40k: Rogue Trader: путь Аримана, десант Хаоса,' },
      { text: '    тактический ИИ. Harmony-патчи + нативная система модов Owlcat.' },
      { text: '' },
      { text: '<span class="blue">02  ZomboidSaveGuard</span> <span class="dim">· powershell · windows</span>' },
      { text: '    автоматические бэкапы и восстановление сохранений Project Zomboid' },
      { text: '    в один клик на Windows.' }
    ];
    return lines;
  };

  SECTIONS.contact = function () {
    var lines = [
      { text: '<span class="dim">## где меня найти</span>' },
      { text: '' },
      { text: '  github    <span class="dim">:</span> <a href="https://github.com/aitools1" target="_blank" rel="noopener">github.com/aitools1</a>' },
      { text: '  mail      <span class="dim">:</span> <a href="mailto:devprotonme1@proton.me">devprotonme1@proton.me</a>' },
      { text: '' },
      { text: '<span class="dim">// отвечаю без ритуалов и призывов демонов. обычно.</span>' }
    ];
    return { lines: lines, social: true };
  };

  // ===== Обработка команд =====

  function run(raw) {
    var cmd = raw.trim().toLowerCase();
    printPrompt(raw);
    if (!cmd) return;
    history.push(raw);
    histIdx = history.length;

    if (cmd === 'clear') { output.innerHTML = ''; return; }
    if (cmd === 'exit') {
      print('<span class="dim">дверь отсека закрыта с той стороны. выхода нет — только проекты.</span>');
      return;
    }
    if (cmd === 'sudo') {
      print('<span class="err">vetmo is not in the sudoers file. This incident will be reported.</span>');
      return;
    }
    if (cmd === 'whoami') {
      print('<span class="gold">vetmo</span> <span class="dim">из секты «Работает — не трогай»</span>');
      return;
    }
    if (cmd === 'ls') {
      print('<span class="blue">about/  projects/  contact/  .secrets/  imperial_truth.pdf</span>');
      return;
    }
    if (cmd === 'help') {
      output.innerHTML = '';
      typeSection(SECTIONS.help());
      return;
    }
    if (cmd === 'about') {
      output.innerHTML = '';
      typeSection(SECTIONS.about());
      return;
    }
    if (cmd === 'projects') {
      output.innerHTML = '';
      typeSection(SECTIONS.projects());
      return;
    }
    if (cmd === 'contact') {
      output.innerHTML = '';
      typeContact();
      return;
    }

    print('<span class="err">bash: ' + esc(cmd) + ': команда не найдена</span> <span class="dim">— введите</span> <span class="ok">help</span>');
  }

  function typeContact() {
    var sec = SECTIONS.contact();
    typeSection(sec.lines, function () {
      // после текста — интерактивная сетка соцкнопок
      var grid = document.createElement('div');
      grid.className = 'social-grid';
      grid.innerHTML = [
        '<a class="social-btn" href="https://github.com/aitools1" target="_blank" rel="noopener"><span class="sym">&gt;_</span> GitHub</a>',
        '<a class="social-btn gold" href="mailto:devprotonme1@proton.me"><span class="sym">@</span> Mail</a>',
        '<a class="social-btn" href="https://aitools1.github.io/portfolio/" target="_blank" rel="noopener"><span class="sym">~</span> Portfolio</a>'
      ].join('');
      printNode(grid);
    });
  }

  // Tab-автодополнение
  var nameList = ['help', 'about', 'projects', 'contact', 'clear', 'exit', 'sudo', 'whoami', 'ls'];
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      run(input.value);
      input.value = '';
    } else if (e.key === 'ArrowUp') {
      if (histIdx > 0) { histIdx--; input.value = history[histIdx] || ''; }
      e.preventDefault();
    } else if (e.key === 'ArrowDown') {
      if (histIdx < history.length) { histIdx++; input.value = history[histIdx] || ''; }
      e.preventDefault();
    } else if (e.key === 'Tab') {
      var v = input.value.trim().toLowerCase();
      if (v) {
        var match = nameList.filter(function (n) { return n.indexOf(v) === 0; });
        if (match.length === 1) { input.value = match[0]; }
        else if (match.length > 1) { print('<span class="dim">' + match.join('  ') + '</span>'); }
      }
      e.preventDefault();
    }
  });

  // Клик по экрану — фокус в ввод
  document.querySelector('.terminal').addEventListener('click', function (e) {
    if (window.getSelection().toString()) return;
    input.focus({ preventScroll: true });
  });

  // ===== Кликабельные чипы =====
  var chipsEl = document.getElementById('chips');

  chipsEl.addEventListener('click', function (e) {
    var btn = e.target.closest('.chip');
    if (!btn) return;
    e.stopPropagation();
    if (btn.dataset.url) {
      printPrompt(btn.dataset.label);
      print('<span class="dim">открываю </span><a href="' + btn.dataset.url + '" target="_blank" rel="noopener">' + esc(btn.dataset.url) + '</a>');
      window.open(btn.dataset.url, '_blank', 'noopener');
    } else {
      run(btn.dataset.cmd);
    }
    input.focus({ preventScroll: true });
  });

  // CTA-кнопка в карточке профиля
  document.getElementById('cta-about').addEventListener('click', function () {
    run('about');
    input.focus({ preventScroll: true });
  });

  // ===== Boot-последовательность =====

  var bootLines = [
    ['dim',  '[    0.000000] ядро portfolio-v0.1 инициализировано'],
    ['dim',  '[    0.142033] загрузка модулей: about.projects.contact .... ok'],
    ['dim',  '[    0.318402] профиль подключён .... ok'],
    ['gold', '[    0.441028] WARNING: veil is thin. соблюдайте осторожность.'],
    ['',     ''],
    ['blue', '  ██╗   ██╗███████╗██████╗ ███████╗███████╗'],
    ['blue', '  ██║   ██║██╔════╝██╔══██╗██╔════╝██╔════╝'],
    ['blue', '  ██║   ██║█████╗  ██████╔╝█████╗  █████╗  '],
    ['blue', '  ╚██║ ██╔╝██╔══╝  ██╔══██╗██╔══╝  ██╔══╝  '],
    ['blue', '   ╚████╔╝ ███████╗██║  ██║███████╗███████╗'],
    ['blue', '    ╚═══╝  ╚══════╝╚═╝  ╚═╝╚══════╝╚══════╝'],
    ['',     ''],
    ['dim',  'введите ']
  ];

  var li = 0;
  var typing = true;

  function typeBoot() {
    if (li < bootLines.length) {
      var item = bootLines[li];
      var d = document.createElement('div');
      d.className = 'out ' + item[0];
      d.innerHTML = item[1];
      boot.appendChild(d);
      li++;
      screen.scrollTop = screen.scrollHeight;
      setTimeout(typeBoot, 90);
    } else {
      var last = boot.lastChild;
      last.innerHTML = 'введите <span class="ok">help</span>, чтобы посмотреть доступные команды';
      typing = false;
      inputLine.style.display = 'flex';
      document.getElementById('chips').style.display = 'flex';
      input.focus();
      run('about');   // стартовая секция печатается тем же эффектом
    }
  }

  typeBoot();
})();

/* ===== Интерактивный фон: дрейфующие глифы кода ===== */
(function () {
  var canvas = document.getElementById('bg-canvas');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  if (!ctx) return;

  var W = 0, H = 0, DPR = 1;
  var glyphs = [];
  var mouse = { x: -9999, y: -9999, inside: false };
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Символы в духе Claude Code: ASCII-границы, стрелки, операторы
  var CHARS = '╭╰─│>#$%&*+=<>(){}[]/\\;:.!?~^|01'.split('');
  var COLORS = [
    '122,162,247',  /* синий  */
    '217,119,87',   /* терракота Claude */
    '224,175,104',  /* золото */
    '158,206,106'   /* зелёный */
  ];

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    spawn();
  }

  function spawn() {
    glyphs = [];
    // плотность зависит от площади экрана
    var count = Math.max(24, Math.min(110, Math.round((W * H) / 16000)));
    for (var i = 0; i < count; i++) {
      glyphs.push({
        x: Math.random() * W,
        y: Math.random() * H,
        ch: CHARS[(Math.random() * CHARS.length) | 0],
        size: 10 + Math.random() * 10,
        speed: 0.15 + Math.random() * 0.35,   // px/кадр вверх
        drift: (Math.random() - 0.5) * 0.2,   // лёгкий горизонтальный дрейф
        alpha: 0.08 + Math.random() * 0.22,
        color: COLORS[(Math.random() * COLORS.length) | 0],
        phase: Math.random() * Math.PI * 2,    // фаза мерцания
        phaseSpeed: 0.5 + Math.random() * 1.5,
        vx: 0, vy: 0                            // отклик на мышь
      });
    }
  }

  window.addEventListener('resize', function () {
    clearTimeout(window.__rz);
    window.__rz = setTimeout(resize, 150);
  });

  window.addEventListener('pointermove', function (e) {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.inside = true;
  });
  window.addEventListener('pointerleave', function () { mouse.inside = false; });

  var last = 0;

  function frame(t) {
    var dt = Math.min((t - last) / 16.6, 3) || 1;
    last = t;
    ctx.clearRect(0, 0, W, H);

    // Мягкое свечение за курсором (как подсветка карточки на референсе)
    if (mouse.inside) {
      var glow = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 260);
      glow.addColorStop(0, 'rgba(217,119,87,0.055)');
      glow.addColorStop(0.5, 'rgba(122,162,247,0.028)');
      glow.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, W, H);
    }

    for (var i = 0; i < glyphs.length; i++) {
      var g = glyphs[i];

      // Реакция на курсор: глифы рядом загораются и мягко расступаются
      var dx = g.x - mouse.x;
      var dy = g.y - mouse.y;
      var dist = Math.sqrt(dx * dx + dy * dy);
      var near = 0;
      if (mouse.inside && dist < 130) {
        near = 1 - dist / 130;
        var f = near * 0.9 * dt;
        g.vx += (dx / (dist + 0.001)) * f;
        g.vy += (dy / (dist + 0.001)) * f;
      }

      // затухание инерции
      g.vx *= 0.92;
      g.vy *= 0.92;

      g.x += (g.drift + g.vx) * dt;
      g.y += (-g.speed + g.vy) * dt;

      // мерцание
      var tw = 0.75 + 0.25 * Math.sin(t / 1000 * g.phaseSpeed + g.phase);
      var a = (g.alpha + near * 0.6) * tw;

      // wrap по краям
      if (g.y < -20) { g.y = H + 20; g.x = Math.random() * W; }
      if (g.y > H + 20) { g.y = -20; }
      if (g.x < -20) { g.x = W + 20; }
      if (g.x > W + 20) { g.x = -20; }

      ctx.font = g.size + 'px "JetBrains Mono", Consolas, monospace';
      ctx.fillStyle = 'rgba(' + g.color + ',' + a.toFixed(3) + ')';
      ctx.fillText(g.ch, g.x, g.y);
    }

    requestAnimationFrame(frame);
  }

  resize();
  if (reduced) {
    // статичная отрисовка одного кадра для тех, кто просил меньше движения
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < glyphs.length; i++) {
      var g = glyphs[i];
      ctx.font = g.size + 'px "JetBrains Mono", Consolas, monospace';
      ctx.fillStyle = 'rgba(' + g.color + ',' + g.alpha + ')';
      ctx.fillText(g.ch, g.x, g.y);
    }
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>
